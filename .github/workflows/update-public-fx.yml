name: Update public CBC exchange rates
on:
  schedule:
    - cron: '47 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-cbc-rates
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_fx.py fx.json
      - name: Publish updated public rates
        run: |
          git add -- fx.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public CBC exchange rates'
          git push

