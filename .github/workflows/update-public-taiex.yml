name: Update public TWSE benchmark
on:
  schedule:
    - cron: '23 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-twse-taiex
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_taiex.py taiex.json
      - name: Publish updated official closing index
        run: |
          git add -- taiex.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public TWSE benchmark'
          git push
